function pick(deck){let pool=C.filter(c=>!deck||c.deck==deck);const now=Date.now();
 const due=pool.filter(c=>!(S.box[c.id])||S.box[c.id].due<=now);const p=due.length?due:pool;
 p.sort((a,b)=>((S.box[a.id]||{b:0}).b-(S.box[b.id]||{b:0}).b)||Math.random()-.5);return p[0];}
function grade(c,ok){const b=S.box[c.id]||{b:0};b.b=ok?Math.min(b.b+1,5):0;b.due=Date.now()+[1,10,60,360,1440,4320][b.b]*60000;S.box[c.id]=b;
 if(ok){S.xp+=10+S.stk*2;S.stk++}else S.stk=0;save();}

 else{let o=c.opts.map((t,i)=>[t,i]);if(c.shuf)o=shuf(o);h+=o.map(([t,i])=>`<button class="opt" data-i="${i}" onclick="ans(${i})">${t}</button>`).join("")}
 $("app").innerHTML=h+`<div id="rev"></div>`;scrollTo(0,0);}
